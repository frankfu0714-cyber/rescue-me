name: RescueMe
options:
  bundleIdPrefix: com.frankfu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "632H46CT74"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  RescueMe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RescueMe
      - path: RescueMe/Resources/VoicePacks
        type: folder
    resources: []
    info:
      path: RescueMe/Info.plist
      properties:
        CFBundleDisplayName: Rescue Me
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - voip
          - audio
        NSPhotoLibraryUsageDescription: Choose a photo for your fake caller contact.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankfu.rescueme
        PRODUCT_NAME: RescueMe
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
